<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HDQ" />
  <title>HDQ Móvil — Hostal HDQ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="login" class="login" hidden>
  <div class="login-brand">
    <div class="login-logo">🏨</div>
    <h1>Hostal HDQ</h1>
    <p>Chiloé 1130, Sector Collao · Concepción</p>
  </div>
  <form id="login-form" class="login-card" novalidate>
    <h2>Iniciar sesión</h2>
    <div id="login-alert"></div>
    <label class="field">
      <span>Usuario</span>
      <input type="text" id="lg-user" autocomplete="username" autocapitalize="none"
             spellcheck="false" placeholder="tu-usuario" required />
    </label>
    <label class="field">
      <span>Contraseña</span>
      <div class="pass-wrap">
        <input type="password" id="lg-pass" autocomplete="current-password" placeholder="••••••••" required />
        <button type="button" id="lg-toggle" class="pass-toggle" aria-label="Mostrar contraseña">👁️</button>
      </div>
    </label>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="lg-btn">Ingresar</button>
  </form>
  <p class="login-foot">Check-in 15:00 · Check-out 11:00<br>© 2026 Hostal HDQ · Portal privado</p>
</section>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btn-back" hidden aria-label="Volver">‹</button>
      <div>
        <div class="topbar-title" id="topbar-title">HDQ</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
    </div>
    <button class="icon-btn" id="btn-refresh" aria-label="Actualizar">⟳</button>
  </header>

  <div id="offline-banner" class="offline-banner" hidden>Sin conexión · mostrando datos guardados</div>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ===== BOTTOM SHEET ===== -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-handle"></div>
  <div id="sheet-body" class="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="../js/auth.js"></script>
<script src="../js/sheets.js"></script>
<script src="../js/reservas.js"></script>
<script src="app.js"></script>
</body>
</html>
